name: Test Suite Module

on:
    workflow_call:

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # PHASE 1: VERIFICATION (The Hybrid Approach)
            # This runs Unit & Integration tests inside the consistent container.
            # The entrypoint is 'task ci' (test-unit + test-integration).
            - name: 🧪 Run CI Pipeline (Dockerized)
              run: docker compose -f docker-compose.ci.yml up --build --exit-code-from ci-runner

            # Optional: Publish Test Results
            # The container maps ./TestResults to the host (via docker-compose volume), so we can upload them.
            - name: 📊 Upload Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results
                  path: TestResults/*.xml
