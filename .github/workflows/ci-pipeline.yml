name: DSA API CI (Production Ready)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ------------------------------------------------------------------
  # Phase 1: Security Analysis (Runs on PR & Push)
  # ------------------------------------------------------------------
  security-analysis:
    uses: ./.github/workflows/security-analysis.yml
    permissions:
      security-events: write
      actions: read
      contents: read

  # ------------------------------------------------------------------
  # Phase 2: Quality Gates (Runs on PR & Push)
  # ------------------------------------------------------------------
  test-suite:
    uses: ./.github/workflows/test-suite.yml
    permissions:
      contents: read

  # ------------------------------------------------------------------
  # Phase 3: Secure Delivery (Runs ONLY on Push to Main)
  # ------------------------------------------------------------------
  docker-delivery:
    needs: [security-analysis, test-suite]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker-delivery.yml
    permissions:
      contents: write
      packages: write
