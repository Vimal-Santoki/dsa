name: Docker Delivery Module

on:
    workflow_call:

jobs:
    docker-delivery:
        runs-on: ubuntu-latest
        permissions:
            packages: write
            contents: write # Required for SemVer Tagging

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Required for Versioning

            # 1. Determine Semantic Version
            - name: Make script executable
              run: chmod +x .github/scripts/calculate-version.sh

            - name: Calculate Semantic Version
              id: semver
              run: ./.github/scripts/calculate-version.sh
              shell: bash

            - name: Log Version
              run: |
                  echo "Calculated Version is ${{ steps.semver.outputs.version }}"
                  echo "Should Release: ${{ steps.semver.outputs.should_release }}"

            - name: Set lower case owner name
              if: steps.semver.outputs.should_release == 'true'
              run: |
                  echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
              env:
                  OWNER: "${{ github.repository_owner }}"

            # 2. Build
            - name: Build Local Image
              if: steps.semver.outputs.should_release == 'true'
              run: |
                  docker build . \
                    --file Dockerfile \
                    --build-arg APP_VERSION=${{ steps.semver.outputs.dotnet_version }} \
                    -t local-dsa-api:${{ github.sha }}

            # 3. Scan Container (SCA)
            - name: Run Trivy (Container)
              if: steps.semver.outputs.should_release == 'true'
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "image"
                  image-ref: "local-dsa-api:${{ github.sha }}"
                  format: "table"
                  severity: "CRITICAL,HIGH"
                  exit-code: "1" # Block push if OS is vulnerable

            # 4. Login & Push
            - name: Login to GHCR
              if: steps.semver.outputs.should_release == 'true'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Push Image
              if: steps.semver.outputs.should_release == 'true'
              run: |
                  VERSION=${{ steps.semver.outputs.version }}

                  # Push Versioned Tag
                  docker tag local-dsa-api:${{ github.sha }} ghcr.io/${{ env.OWNER_LC }}/dsa-api:$VERSION
                  docker push ghcr.io/${{ env.OWNER_LC }}/dsa-api:$VERSION

                  # Push Latest Tag
                  docker tag local-dsa-api:${{ github.sha }} ghcr.io/${{ env.OWNER_LC }}/dsa-api:latest
                  docker push ghcr.io/${{ env.OWNER_LC }}/dsa-api:latest

            # 5. Create Git Tag
            - name: Create Git Tag
              if: steps.semver.outputs.should_release == 'true'
              run: |
                  git config user.name "GitHub Actions"
                  git config user.email "actions@github.com"
                  git tag ${{ steps.semver.outputs.version }}
                  git push origin ${{ steps.semver.outputs.version }}
