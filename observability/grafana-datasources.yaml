apiVersion: 1

datasources:
    - name: Prometheus
      type: prometheus
      uid: prometheus
      access: proxy
      orgId: 1
      url: http://prometheus:9090
      basicAuth: false
      isDefault: true
      editable: true
      jsonData:
          exemplarTraceIdDestinations:
              - datasourceUid: tempo
                name: trace_id
              - datasourceUid: tempo
                name: TraceId

    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      orgId: 1
      url: http://tempo:3200
      basicAuth: false
      isDefault: false
      editable: true
      jsonData:
          httpMethod: GET
          nodeGraph:
              enabled: true
          tracesToLogsV2:
              datasourceUid: "loki"
              spanStartTimeShift: "-1h"
              spanEndTimeShift: "1h"
              tags:
                  - key: "service.name"
                    value: "service_name"
              filterByTraceID: true
              filterBySpanID: true

    - name: Loki
      type: loki
      uid: loki
      access: proxy
      orgId: 1
      url: http://loki:3100
      basicAuth: false
      isDefault: false
      editable: true
      jsonData:
          derivedFields:
              - name: "TraceID"
                # Tells Grafana to look at the 'trace_id' label/metadata instead of the log line
                matcherType: "label"
                matcherRegex: "trace_id" # The exact name of the label in your metadata
                datasourceUid: "tempo" # The UID of your Tempo data source
                url: "$${__value.raw}" # Uses the label's value as the trace ID
                internal: true # Enables the "split-pane" view in Explore
